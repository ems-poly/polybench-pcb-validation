# Tag "vX.Y.Z" -> build (no OIDC) -> manual approval in the "pypi" environment -> publish with PyPI
# trusted publishing (no API token is stored anywhere).
# One-time setup is in RELEASE_CHECKLIST (PyPI pending publisher, GitHub environment with a required reviewer, tag ruleset).
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches pyproject and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          file_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$file_version" != "$version" ]; then
            echo "::error::Tag $TAG != pyproject version $file_version"; exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $version"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build --outdir dist/
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi            # required reviewer = the maintainer; the environment name must match the PyPI trusted publisher
      url: https://pypi.org/p/polybench-pcb-validation
    permissions:
      id-token: write       # mandatory for trusted publishing; job level only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        # Attestations are on by default with trusted publishing.
