; Polybench demo firmware for the Espressif ESP32-S3-DevKitC-1 (N16R8 module: 16 MB flash, 8 MB octal PSRAM).
; pioarduino platform (arduino-esp32 core 3.x), same as the other projects; the official platformio/espressif32 is stuck on core 2.x.
[env:esp32-s3-devkitc-1]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode          = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLED_GPIO_DEFAULT=38      ; DevKitC-1 v1.1; v1.0 boards use GPIO48 (send "led 48" or change this)
    ; neutral paths in the image: build-machine directories are mapped away (assert and log strings)
    -ffile-prefix-map=${platformio.packages_dir}/framework-arduinoespressif32=arduino-esp32
    -ffile-prefix-map=${platformio.packages_dir}=pio-packages
    -ffile-prefix-map=${platformio.core_dir}=pio-core
    -ffile-prefix-map=${platformio.workspace_dir}/..=project
