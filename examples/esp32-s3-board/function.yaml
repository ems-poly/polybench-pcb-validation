steps:
  - id: function
    title: Program and function
    gate: {requires: [powered]}
    sections:
      - id: program
        title: Program
        instructions: "Connect the USB-C port that goes through the USB-UART bridge (CH343P) to the Mac with a data cable. That is USB1, the connector beside the CH343P chip on the J2 header side (SCH V1.4; the right-hand port looking at the USB end with the component side up, marked COM; stated by the operator, the orientation is an interpretation to confirm, see the README; UNVALIDATED until the first run). It is used for flashing here and for the serial self-test below; the native USB port is not connected to the demo firmware's serial. Run flash; the demo firmware replaces whatever is on the board."
        actions:
          - id: flash
            title: Flash the demo firmware (esptool)
            plugin: esptool.flash
            params:
              image: examples/esp32-s3-board/firmware/prebuilt/esp32s3-devkitc-demo.factory.bin
              offset: "0x0"
              sha256: bc5d5d08e9454dfeafeb3dd1689e2144835b8ae2613c50877ada4777dd8f50d0
              simulate_without_image: true     # --simulate runs without the binary (wheel copies do not carry it); a real flash needs the file
              prompt: "Is the board plugged in by its USB-UART bridge port (data cable)? Only if esptool cannot connect: hold BOOT, tap RESET, release BOOT, then run again."
              map: {flashed: F01, image_sha256: F02}
            proposes: [F01, F02]
        tests:
          - {id: F01, title: Image written and hash verified by esptool, kind: yn, limit: {class: guess, equals: "yes", source: {type: estimate}, closes_on: "first run on a real board (UNVALIDATED until then)"}}
          - {id: F02, title: Image SHA-256, kind: text, limit: {class: record}}
      - id: identify
        title: Identify
        instructions: "Reads the chip, MAC and flash size from the ROM bootloader. Changes nothing."
        actions:
          - id: identify
            title: Read chip, MAC, flash and PSRAM size (esptool)
            plugin: esptool.identify
            params:
              map: {chip: F03, mac: F04, flash_mb: F05, psram_mb: F06}
            proposes: [F03, F04, F05, F06]
        tests:
          - {id: F03, title: Chip type, kind: choice, options: [ESP32-S3, other], limit: {class: record}}
          - {id: F04, title: MAC address, kind: text, limit: {class: record}}
          - {id: F05, title: Flash size (esptool), kind: number, unit: MB, limit: {class: guess, min: 16, max: 16, source: {type: estimate, note: "N16R8 module"}, closes_on: "the module variant printed on the shield (N8, N16R8 ...)"}}
          - {id: F06, title: Embedded PSRAM size (esptool), kind: number, unit: MB, limit: {class: guess, min: 8, max: 8, source: {type: estimate, note: "N16R8 module"}, closes_on: "the module variant printed on the shield (N8, N16R8 ...)"}}
      - id: selftest
        title: Serial self-test
        instructions: "The demo firmware reports what it sees over serial (UART port, firmware running: press RESET alone if you held BOOT before). The LED step sends `led 48` (the RGB LED is on GPIO48 behind the RGB solder jumper) and then asks what you saw. The RGB jumper is open on the operator's boards (stated, 10 Nov 2026), so the LED does not light there and No is the expected answer; the answer is recorded with no verdict (F12). Yes is expected only on a board whose RGB jumper is bridged (plan test U07). Test F09 of earlier revisions is retired. `timeout_s` is the time for one attempt and is longer than the slowest command (the LED blink takes 4.8 s)."
        actions:
          - id: selftest
            title: Run the serial self-test (serial.query)
            plugin: serial.query
            params:
              steps:
                - {send: selftest, timeout_s: 6, retries: 1, map: {flash_mb: F07, psram_mb: F08, mac: F11}, units: {flash_mb: MB, psram_mb: MB}}
                - {send: "led 48", timeout_s: 12, retries: 0, ask: {prompt: "Did the RGB LED blink red, green, blue? (With the RGB jumper open it cannot; answer what you see.)", test: F12}}
                - {send: wifi, timeout_s: 15, retries: 0, map: {count: F10}}
            proposes: [F07, F08, F10, F11, F12]
        tests:
          - {id: F07, title: Flash size (firmware), kind: number, unit: MB, limit: {class: guess, min: 16, max: 16, source: {type: estimate}, closes_on: "the module variant printed on the shield"}}
          - {id: F08, title: PSRAM size (firmware), kind: number, unit: MB, limit: {class: guess, min: 8, max: 8, source: {type: estimate}, closes_on: "the module variant printed on the shield"}}
          - {id: F10, title: Wi-Fi access points seen in one scan, kind: number, unit: count, limit: {class: guess, min: 1, source: {type: estimate}, closes_on: "a place with at least one 2.4 GHz access point"}}
          - {id: F11, title: MAC address (firmware), kind: text, limit: {class: record}}
          - {id: F12, title: "RGB LED at the LED step: Y blinked red, green, blue; N did not light (record only; N is what the RGB jumper open gives, Y needs it bridged, U07)", kind: choice, options: ["Y", "N"], limit: {class: record}}
