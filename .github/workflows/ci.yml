# Simulator-only CI on GitHub-hosted runners (macOS and Linux). No hardware, no self-hosted runner, no secrets.
# A pull request from a fork runs this with a read-only token.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest, windows-11-arm]
    # Linux went green on 12 Nov (71b2d35) but stays non-blocking until it has a run history.
    # Windows (x64 and ARM64) is a trial for the Windows port (UIR-56): it never blocks a merge; its job is to produce
    # the real failure list. Expected to fail until the port lands.
    continue-on-error: ${{ matrix.os != 'macos-latest' }}
    defaults:
      run:
        shell: bash     # Git Bash on the Windows runners, so the same steps run everywhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Keep tests away from any real data or config folder
        # `runner` is not available in workflow-level env, so set these per job.
        run: |
          echo "POLYBENCH_DATA=$RUNNER_TEMP/polybench-data" >> "$GITHUB_ENV"
          echo "POLYBENCH_CONFIG_DIR=$RUNNER_TEMP/polybench-config" >> "$GITHUB_ENV"
      - name: Install with the extras the simulator tests need
        # Windows ARM64: opencv-python has no win_arm64 wheel (12 Nov, UIR-56 TBR-W-ARM), so the camera, scanner and AOI
        # extras cannot install there yet; the core and KiCad extras are tested alone.
        run: |
          if [ "${{ matrix.os }}" = "windows-11-arm" ]; then
            python -m pip install -e ".[dev,kicad]"
          else
            python -m pip install -e ".[dev,scanner,aoi,kicad,camera]"
          fi
      - name: Install the WebKit and Chromium browsers the page tests drive
        run: python -m playwright install --with-deps webkit chromium
      - name: Test (simulator only, no browser click-through)
        # On Windows, keep going past test files that fail to import, so the trial lists every failure.
        run: python -m pytest -m "not e2e" -q ${{ runner.os == 'Windows' && '--continue-on-collection-errors -p no:cacheprovider' || '' }}

  package:
    name: build, twine check, install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine pipx
          python -m build --outdir dist/
          python -m twine check --strict dist/*
      - name: Fresh venv install from the wheel
        run: |
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/v/bin/polybench" --help
          "$RUNNER_TEMP/v/bin/polybench" doctor --json > /dev/null || true   # amber/red lines are expected on a bare runner
      - name: pipx install from the wheel
        env:
          PIPX_HOME: ${{ runner.temp }}/pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx-bin
        run: |
          pipx install dist/*.whl
          "$PIPX_BIN_DIR/polybench" --help
      - name: Lint the demo protocol with the installed command
        run: |
          "$RUNNER_TEMP/v/bin/polybench" lint src/polybench/examples/demo/demo.pcbv.yaml

  voice-install-trial:
    # TBR from the support proposal: can hosted macOS install mlx-whisper? A trial, never blocking.
    name: voice extra installs on hosted macOS (trial)
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ".[voice]"
      - run: python -c "import mlx_whisper, sounddevice; print('voice extra imports')"
